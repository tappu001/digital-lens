<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Digital Lens Recorder</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 320px; font: 13px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; color: #08152e; background: #f3f7fd; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #fff; border-bottom: 1px solid #dce5f2; }
    header img { width: 26px; height: 26px; }
    header b { font-size: 14px; }
    header small { display: block; color: #5b6a82; font-size: 11px; }
    main { padding: 14px 16px 16px; }
    .state { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #b9c3d3; }
    .rec .dot { background: #e5484d; box-shadow: 0 0 0 0 rgba(229, 72, 77, .5); animation: p 1.6s infinite; }
    @keyframes p { 70% { box-shadow: 0 0 0 7px rgba(229, 72, 77, 0); } 100% { box-shadow: 0 0 0 0 rgba(229, 72, 77, 0); } }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0 14px; }
    .stats div { background: #fff; border: 1px solid #dce5f2; border-radius: 10px; padding: 8px; text-align: center; }
    .stats b { display: block; font-size: 17px; }
    .stats span { font-size: 10.5px; color: #5b6a82; }
    p { margin: 0 0 12px; color: #5b6a82; }
    button, a.btn { display: block; width: 100%; height: 38px; border: 0; border-radius: 10px; font: 700 13px/38px inherit; text-align: center; cursor: pointer; text-decoration: none; margin-top: 8px; }
    .primary { background: #08152e; color: #fff; }
    .danger { background: #e5484d; color: #fff; }
    .ghost { background: #fff; color: #1467f5; border: 1px solid #dce5f2 !important; }
    .site { font-size: 12px; color: #5b6a82; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header><img src="icons/icon48.png" alt=""><div><b>Digital Lens Recorder</b><small>Ecommerce Audit · dataLayer + GA4 hits</small></div></header>
  <main id="main">Loading…</main>
  <script src="popup.js"></script>
</body>
</html>
