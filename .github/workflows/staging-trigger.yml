name: Publish staging

# A push to staging republishes the site (live + /staging/) through pages.yml on main.
on:
  push:
    branches: [staging]

permissions:
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
